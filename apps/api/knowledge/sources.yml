# Pathwise source manifest
# status values: approved | proposed | blocked
# Only approved entries are fetched and ingested.
# Proposed entries are candidates for future approval.
# Run fetch_sources.py to download approved entries; it will set
# blocked: true in the snapshot front matter for any 403/disallowed URL.
#
# HTTP status checked 2026-09-28:
#   ecfr.gov       — robots.txt allows; renderer API returns 200
#   uscis.gov      — robots.txt Disallow: /; all URLs return 403
#   studyinthestates.dhs.gov — robots.txt Disallow: /; all URLs return 403
#   ice.gov        — robots.txt Disallow: /; all URLs return 403
#   federalregister.gov — robots.txt allows; HTML pages redirect to
#                         https://unblock.federalregister.gov/ (Cloudflare JS challenge)

sources:

