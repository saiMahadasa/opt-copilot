    topics:
      - f1-status
      - taxes
      - nonresident-alien
    notes: >
      F-1 students are exempt from the Substantial Presence Test during their
      first 5 calendar years. Critical for students filing taxes during OPT.
      IRS.gov accessibility needs verification.
    status: proposed

