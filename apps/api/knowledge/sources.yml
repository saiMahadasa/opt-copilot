    # Renderer API is the only endpoint that returns content without a JS challenge.
    # The canonical HTML URL redirects to https://unblock.federalregister.gov/ (200, Cloudflare).
    fetch_url: "https://www.ecfr.gov/api/renderer/v1/content/enhanced/current/title-8?chapter=I&subchapter=B&part=214&section=214.2"
    agency: "DHS / USCIS"
