  - id: irs_f1_fica_exemption
    title: "IRS — FICA and FUTA Tax Exemption for F-1 Students"
    url: "https://www.irs.gov/individuals/international-taxpayers/foreign-student-liability-for-fica-and-futa-taxes"
    agency: "IRS"
    type: html
    authority: guidance
    topics:
      - f1-status
      - opt
      - stem-opt
      - taxes
      - fica
    notes: >
      F-1 students are typically exempt from FICA (Social Security and Medicare)
      taxes during their first 5 calendar years in the US as nonresident aliens.
      Highly asked: 'Do I have to pay Social Security tax on OPT?'
      IRS.gov accessibility needs verification — try fetch_sources.py first.
    status: proposed

