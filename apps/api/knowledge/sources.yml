    topics:
      - f1-status
      - opt
      - stem-opt
      - cap-gap
      - unemployment-limit
      - grace-period
      - employment-authorization
      - cpt
    notes: >
      Keep only paragraph (f). The renderer API (fetch_url) returns the full
      section as HTML; extraction filters to id="p-214.2(f)" and descendants.
      Canonical HTML URL returns HTTP 200 but final URL is
      https://unblock.federalregister.gov/ (Cloudflare JS challenge, not usable).
      Renderer API: HTTP 200, final URL unchanged.
    status: approved

